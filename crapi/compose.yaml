name: crapi

include:
  - ../kali/compose.yaml

# Adapted from crAPI's deploy/docker/docker-compose.yml, with its stock credentials.
# Nothing is published to the host, state is not persisted, and the chatbot is left
# out because it needs an OpenAI key and internet access.

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 15s
  retries: 15

x-databases: &databases
  DB_NAME: crapi
  DB_USER: admin
  DB_PASSWORD: crapisecretpassword
  DB_HOST: postgresdb
  DB_PORT: 5432
  MONGO_DB_HOST: mongodb
  MONGO_DB_PORT: 27017
  MONGO_DB_USER: admin
  MONGO_DB_PASSWORD: crapisecretpassword
  MONGO_DB_NAME: crapi

services:
  crapi-web:
    image: crapi/crapi-web:latest@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      CHATBOT_SERVICE: crapi-chatbot:5002
      MAILHOG_WEB_SERVICE: mailhog:8025
      TLS_ENABLED: "false"
    depends_on:
      crapi-community: { condition: service_healthy }
      crapi-identity: { condition: service_healthy }
      crapi-workshop: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: curl 0.0.0.0:80/health
    networks:
      lab:
        # nginx will not start unless the chatbot hostname resolves.
        aliases: [crapi-chatbot]

  crapi-identity:
    image: crapi/crapi-identity:latest@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
    environment:
      <<: *databases
      LOG_LEVEL: INFO
      SERVER_PORT: 8080
      ENABLE_SHELL_INJECTION: "false"
      ENABLE_LOG4J: "false"
      JWT_SECRET: crapi
      JWT_EXPIRATION: 604800000
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_EMAIL: user@example.com
      SMTP_PASS: xxxxxxxxxxxxxx
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: "false"
    depends_on:
      postgresdb: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      mailhog: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: /app/health.sh
    networks: [lab]

  crapi-community:
    image: crapi/crapi-community:latest@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
    environment:
      <<: *databases
      LOG_LEVEL: INFO
      SERVER_PORT: 8087
      IDENTITY_SERVICE: crapi-identity:8080
      TLS_ENABLED: "false"
    depends_on:
      postgresdb: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      crapi-identity: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: /app/health.sh
    networks: [lab]

  crapi-workshop:
    image: crapi/crapi-workshop:latest@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
    environment:
      <<: *databases
      LOG_LEVEL: INFO
      SERVER_PORT: 8000
      IDENTITY_SERVICE: crapi-identity:8080
      SECRET_KEY: crapi
      API_GATEWAY_URL: https://api.mypremiumdealership.com
      TLS_ENABLED: "false"
      FILES_LIMIT: 1000
    depends_on:
      postgresdb: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      crapi-identity: { condition: service_healthy }
      crapi-community: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: /app/health.sh
    networks: [lab]

  postgresdb:
    image: postgres:14@sha256:834a046089d76edd1d2e81c4741f3ad5d1853646ededc86c2708936aad31c1ed
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready"]
    networks: [lab]

  mongodb:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    healthcheck:
      <<: *healthcheck
      test: echo 'db.runCommand("ping").ok' | mongo mongodb:27017/test --quiet
      start_period: 20s
    networks: [lab]

  # Catches the emails crAPI sends (sign-up, OTP, vehicle details).
  mailhog:
    image: crapi/mailhog:latest@sha256:015c23f79d40c9dc1800cd0a458503b89aeda3b585a12c37d53829d6c7d61fdd
    user: root
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@mongodb:27017
      MH_STORAGE: mongodb
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "nc", "-z", "localhost", "8025"]
    networks: [lab]

  api.mypremiumdealership.com:
    image: crapi/gateway-service:latest@sha256:97dade9daf0e758547b1686e2d3303c8c9b79838167f728a9211f0ee1f4622b0
    healthcheck:
      <<: *healthcheck
      test: bash -c 'echo -n "GET / HTTP/1.1\n\n" > /dev/tcp/127.0.0.1/443'
      start_period: 15s
    networks: [lab]
