repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: just gitleaks --pre-commit --staged
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: just zizmor
        language: system
        pass_filenames: false
        files: ^\.github/
      - id: check-digests
        name: check-digests
        entry: just check-digests
        language: system
        pass_filenames: false
        files: (compose.*\.ya?ml|Dockerfile.*)$
