# Shared attacker desktop, included by each lab's compose.yaml.
services:
  kali:
    build: .
    image: lab-kali
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-kalilab}
    shm_size: 2gb
    volumes:
      - kali-home:/home/kali
    networks: [lab]

  # Only path between the host and the lab: forwards the Kali desktop (noVNC).
  gateway:
    image: alpine/socat:latest@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    command: TCP-LISTEN:6080,fork,reuseaddr TCP:kali:6080
    ports:
      - "127.0.0.1:6080:6080"
    read_only: true
    cap_drop: [ALL]
    depends_on: [kali]
    networks: [lab, edge]

networks:
  # No route to the host network or the internet.
  lab:
    internal: true
  edge:

volumes:
  # Shared by every lab, so it is created outside Compose (see `lab-up` in the justfile).
  kali-home:
    external: true
